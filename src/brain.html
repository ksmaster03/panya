<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panya · สมองที่สอง</title>
<style>
  :root {
    --bg: #071226; --bg2: #0d1f3d; --ink: #e8eef9; --muted: #93a4c2; --line: #1e3358;
    --teal: #4fd1c5; --amber: #f6b352; --blue: #6aa9ff; --rose: #f08aa8; --violet: #a78bfa; --green: #7ddc8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 30% 20%, var(--bg2), var(--bg) 70%);
    color: var(--ink); font-family: "Leelawadee UI", "Noto Sans Thai", Tahoma, system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; white-space: nowrap; }
  h1 span { color: var(--muted); font-weight: 400; }
  form { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
  input, button {
    font: inherit; color: var(--ink); background: #0b1a33; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  #q { flex: 1 1 auto; }
  button { cursor: pointer; background: #12305a; }
  button:hover { background: #18407a; }
  #stats { color: var(--muted); font-size: 13px; white-space: nowrap; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); padding: 14px 16px; overflow: auto; background: rgba(7, 18, 38, .6); }
  aside h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .hit { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: #0b1a33; }
  .hit:hover, .hit.on { border-color: var(--amber); }
  .hit p { margin: 0 0 6px; line-height: 1.55; font-size: 14px; overflow-wrap: anywhere; }
  .hit small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  #tip {
    position: absolute; pointer-events: none; max-width: 340px; background: #0b1a33; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; font-size: 13px; line-height: 1.5; display: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); overflow-wrap: anywhere;
  }
  #tip small { color: var(--muted); display: block; margin-top: 4px; }
  #gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 18, 38, .88); }
  #gate form { flex-direction: column; flex: none; width: min(360px, 86vw); }
  #gate p { margin: 0 0 4px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } body { overflow: auto; } }
</style>
</head>
<body>
<header>
  <h1>panya <span>· สมองที่สอง</span></h1>
  <form id="search">
    <input id="q" placeholder="ถามความจำ เช่น ท่าไหนปิดซ่อม" autocomplete="off">
    <button>ค้น</button>
  </form>
  <div id="stats"></div>
  <button id="export" type="button" hidden>ส่งออก</button>
  <button id="logout" type="button" hidden>ออกจากระบบ</button>
</header>
<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip"></div>
    <div id="gate">
      <form id="login">
        <p>เข้าสู่ระบบด้วยชื่อสมอง (brain) และ API key ของสมองนั้น ทั้งสองค่าจะถูกจำไว้ในแท็บนี้เท่านั้น</p>
        <input id="container" placeholder="ชื่อสมอง (brain)" autocomplete="username" required>
        <input id="key" type="password" placeholder="API key" autocomplete="current-password" required>
        <button>เข้าสู่ระบบ</button>
        <p id="err" style="color: var(--rose)"></p>
      </form>
    </div>
  </div>
  <aside>
    <h2 id="side-title">ผลการค้น</h2>
    <div id="hits"><p class="empty">พิมพ์คำถามด้านบน จุดที่เกี่ยวข้องจะสว่างขึ้นบนสมอง ชี้ที่จุดใดก็ได้เพื่ออ่านความจำนั้น</p></div>
    <div class="legend" id="legend"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id)
const canvas = $('c'), ctx = canvas.getContext('2d')
const PALETTE = ['#4fd1c5', '#f6b352', '#6aa9ff', '#f08aa8', '#a78bfa', '#7ddc8a', '#ffd166', '#5eead4', '#fca5a5', '#93c5fd']
// โครงสมองมองจากด้านข้าง หันหน้าไปทางซ้าย ในกรอบ 1000 x 760
const BRAIN = new Path2D('M150 420 C90 330 130 190 260 130 C330 60 470 40 560 70 C660 40 800 90 850 190 C930 250 950 380 880 450 C900 520 850 590 760 590 C720 600 680 590 650 560 C640 640 620 700 600 740 L540 740 C550 680 545 620 520 570 C440 600 330 590 270 540 C200 530 150 480 150 420 Z')
const FOLDS = [
  'M260 130 C300 210 250 300 330 360', 'M420 70 C400 170 480 230 440 330', 'M560 70 C600 160 540 250 610 320',
  'M720 100 C700 200 780 260 740 360', 'M850 190 C790 250 830 330 780 420', 'M180 380 C280 400 360 450 470 430',
  'M470 430 C560 410 640 460 760 440', 'M300 500 C380 470 450 520 520 500', 'M700 520 C740 500 790 540 830 510',
].map((d) => new Path2D(d))

let nodes = [], edges = [], neighbors = [], groups = [], lit = new Map(), hover = -1, pinned = -1, view = { s: 1, ox: 0, oy: 0 }, t0 = performance.now()
const cfg = { container: sessionStorage.getItem('panya.container') || new URLSearchParams(location.search).get('brain') || '', key: sessionStorage.getItem('panya.key') || '' }

const api = async (path, body) => {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { authorization: 'Bearer ' + cfg.key, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  })
  if (!res.ok) throw new Error(res.status === 401 ? 'API key ไม่ถูกต้อง' : res.status === 403 ? 'key นี้ใช้กับสมองนี้ไม่ได้' : 'เซิร์ฟเวอร์ตอบ ' + res.status)
  return res.json()
}

// หมวดของความจำ: ใช้คำแรกของ source หรือ subject ถ้าไม่มีใช้ kind
const groupOf = (n) => {
  const tail = (n.source || '').split(/[\\/]/).pop() || ''
  const head = (tail || n.subject || '').split(/[_:.\-\s]/)[0]
  return head && head.length <= 14 ? head.toLowerCase() : n.kind
}

// วางจุดให้เต็มรูปสมอง: เรียงตามแกน x ของ PCA แล้วเกลี่ยตามพื้นที่ของรูป จากนั้นเรียงแกน y ภายในแต่ละคอลัมน์
function layout() {
  const off = new OffscreenCanvas(8, 8).getContext('2d')
  const COLS = 120, STEP = 4, cols = []
  for (let i = 0; i < COLS; i++) {
    const x = 100 + ((i + 0.5) / COLS) * 860
    const ys = []
    for (let y = 30; y <= 750; y += STEP) if (off.isPointInPath(BRAIN, x, y)) ys.push(y)
    cols.push({ x, ys })
  }
  const total = cols.reduce((a, c) => a + c.ys.length, 0)
  const order = nodes.map((n, i) => i).sort((a, b) => nodes[a].x - nodes[b].x)
  // ตำแหน่งแนวตั้งใช้อันดับของแกน y เทียบกับทั้งชุด ไม่ใช่ภายในคอลัมน์ ไม่งั้นข้อมูลน้อยจะกองเป็นเส้นตรงกลาง
  const vRank = new Map(nodes.map((n, i) => i).sort((a, b) => nodes[b].y - nodes[a].y).map((idx, r) => [idx, (r + 0.5) / nodes.length]))
  let k = 0, acc = 0
  for (const col of cols) {
    acc += col.ys.length
    const upto = Math.round((acc / total) * order.length)
    const members = order.slice(k, upto)
    k = upto
    members.forEach((idx) => {
      const pos = col.ys.length ? col.ys[Math.min(col.ys.length - 1, Math.floor(vRank.get(idx) * col.ys.length))] : 380
      const jitter = (h) => (((Math.sin(idx * 12.9898 + h) * 43758.5453) % 1) + 1) % 1 - 0.5
      nodes[idx].px = col.x + jitter(1) * (860 / COLS) * 0.9
      nodes[idx].py = pos + jitter(2) * STEP * 2
    })
  }
}

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1
  canvas.width = r.width * dpr; canvas.height = r.height * dpr
  const s = Math.min(r.width / 1000, r.height / 780) * 0.96
  view = { s: s * dpr, ox: (r.width - 1000 * s) / 2 * dpr, oy: (r.height - 780 * s) / 2 * dpr, dpr }
}

function draw(now) {
  const t = (now - t0) / 1000
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy)

  ctx.fillStyle = 'rgba(79, 209, 197, .05)'; ctx.fill(BRAIN)
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(106, 169, 255, .55)'; ctx.stroke(BRAIN)
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(106, 169, 255, .14)'
  for (const f of FOLDS) ctx.stroke(f)

  const focus = pinned >= 0 ? pinned : hover
  const near = focus >= 0 ? new Set(neighbors[focus]) : null
  const searching = lit.size > 0

  ctx.lineWidth = 0.7
  for (const [a, b, sim] of edges) {
    const A = nodes[a], B = nodes[b]
    const hot = (lit.has(a) && lit.has(b)) || a === focus || b === focus
    ctx.strokeStyle = hot ? 'rgba(246, 179, 82, .85)' : `rgba(120, 170, 255, ${searching ? 0.04 : 0.05 + Math.max(0, sim - 0.84) * 0.9})`
    ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(B.px, B.py); ctx.stroke()
  }

  nodes.forEach((n, i) => {
    const score = lit.get(i)
    const isLit = score !== undefined, isFocus = i === focus, isNear = near && near.has(i)
    const base = 2.4 + Math.min(3, Math.log2(1 + n.count))
    const pulse = isLit ? 1 + 0.25 * Math.sin(t * 4 + i) : 1
    const r = (isLit ? base + 3 + score * 4 : isFocus ? base + 3 : base) * pulse
    ctx.globalAlpha = searching && !isLit && !isFocus && !isNear ? 0.22 : 1
    if (isLit || isFocus) { ctx.shadowColor = isLit ? '#f6b352' : n.color; ctx.shadowBlur = 18 } else ctx.shadowBlur = 0
    ctx.fillStyle = isLit ? '#f6b352' : n.color
    ctx.beginPath(); ctx.arc(n.px, n.py, r, 0, Math.PI * 2); ctx.fill()
  })
  ctx.globalAlpha = 1; ctx.shadowBlur = 0
  requestAnimationFrame(draw)
}

function pick(ev) {
  const r = canvas.getBoundingClientRect()
  const x = ((ev.clientX - r.left) * view.dpr - view.ox) / view.s, y = ((ev.clientY - r.top) * view.dpr - view.oy) / view.s
  let best = -1, bd = 14 * 14
  nodes.forEach((n, i) => { const d = (n.px - x) ** 2 + (n.py - y) ** 2; if (d < bd) { bd = d; best = i } })
  return best
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const when = (ms) => new Date(ms).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })

canvas.addEventListener('mousemove', (ev) => {
  hover = pick(ev)
  const tip = $('tip')
  if (hover < 0) { tip.style.display = 'none'; canvas.style.cursor = 'default'; return }
  const n = nodes[hover], r = canvas.getBoundingClientRect()
  tip.innerHTML = `${esc(n.text)}<small>${esc(n.group)} · ${when(n.createdAt)}${n.source ? ' · ' + esc(n.source) : ''}</small>`
  tip.style.display = 'block'
  tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 350) + 'px'
  tip.style.top = Math.min(ev.clientY - r.top + 14, r.height - 120) + 'px'
  canvas.style.cursor = 'pointer'
})
canvas.addEventListener('mouseleave', () => { hover = -1; $('tip').style.display = 'none' })
canvas.addEventListener('click', (ev) => {
  const i = pick(ev)
  pinned = i === pinned ? -1 : i
  if (pinned >= 0) showList('ความจำนี้และที่ใกล้เคียง', [pinned, ...neighbors[pinned]].map((idx) => ({ idx })))
})

function showList(title, items, emptyText) {
  $('side-title').textContent = title
  $('hits').innerHTML = items.length
    ? items.map(({ idx, score }) => {
        const n = nodes[idx]
        return `<div class="hit" data-i="${idx}"><p>${esc(n.text)}</p><small>${score !== undefined ? 'คะแนน ' + score.toFixed(2) + ' · ' : ''}${esc(n.group)} · ${when(n.createdAt)}${n.source ? ' · ' + esc(n.source) : ''}</small></div>`
      }).join('')
    : `<p class="empty">${esc(emptyText || '')}</p>`
  for (const el of $('hits').querySelectorAll('.hit')) {
    el.addEventListener('mouseenter', () => { hover = Number(el.dataset.i) })
    el.addEventListener('mouseleave', () => { hover = -1 })
    el.addEventListener('click', () => { pinned = Number(el.dataset.i) })
  }
}

$('search').addEventListener('submit', async (ev) => {
  ev.preventDefault()
  const q = $('q').value.trim()
  lit = new Map(); pinned = -1
  if (!q) return showList('ผลการค้น', [], 'พิมพ์คำถามด้านบน')
  try {
    const r = await api('/v1/search', { brain: cfg.container, q, limit: 8 })
    const byId = new Map(nodes.map((n, i) => [n.id, i]))
    const items = r.hits.map((h) => ({ idx: byId.get(h.id), score: h.score })).filter((x) => x.idx !== undefined)
    for (const it of items) lit.set(it.idx, it.score)
    showList(`ผลการค้น ${items.length} รายการ`, items, r.reason === 'unknown_entity'
      ? 'ไม่ตอบ: คำถามนี้ถามถึงรายที่ไม่เคยปรากฏในความจำ'
      : 'ไม่มีความจำที่เกี่ยวข้องพอ สมองเลือกตอบว่าไม่รู้')
  } catch (e) { showList('ผลการค้น', [], e.message) }
})

async function open() {
  const g = await api('/v1/graph?brain=' + encodeURIComponent(cfg.container))
  nodes = g.nodes; edges = g.edges
  neighbors = nodes.map(() => [])
  for (const [a, b] of edges) { neighbors[a].push(b); neighbors[b].push(a) }
  const counts = new Map()
  for (const n of nodes) { n.group = groupOf(n); counts.set(n.group, (counts.get(n.group) || 0) + 1) }
  groups = [...counts.entries()].sort((a, b) => b[1] - a[1])
  const color = new Map(groups.map(([name], i) => [name, PALETTE[i % PALETTE.length]]))
  for (const n of nodes) n.color = color.get(n.group)
  layout()
  $('stats').textContent = `${nodes.length.toLocaleString()} ความจำ · ${edges.length.toLocaleString()} เส้นเชื่อม · ${cfg.container}`
  $('legend').innerHTML = groups.slice(0, 10).map(([name, c]) => `<span><i style="background:${color.get(name)}"></i>${esc(name)} ${c}</span>`).join('')
  $('gate').style.display = 'none'
  $('export').hidden = false; $('logout').hidden = false
  if (!nodes.length) showList('ผลการค้น', [], 'สมองนี้ยังไม่มีความจำ')
}

$('login').addEventListener('submit', async (ev) => {
  ev.preventDefault()
  cfg.container = $('container').value.trim(); cfg.key = $('key').value.trim()
  try {
    await open()
    sessionStorage.setItem('panya.container', cfg.container); sessionStorage.setItem('panya.key', cfg.key)
  } catch (e) { $('err').textContent = e.message }
})

$('logout').addEventListener('click', () => {
  sessionStorage.removeItem('panya.container'); sessionStorage.removeItem('panya.key')
  location.href = location.pathname
})
// ส่งออกทั้งสมองเป็นไฟล์ JSON ที่นำกลับเข้าได้ด้วย POST /v1/import
$('export').addEventListener('click', async () => {
  try {
    const data = await api('/v1/export?brain=' + encodeURIComponent(cfg.container))
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }))
    a.download = 'panya-' + cfg.container + '.json'
    a.click()
    URL.revokeObjectURL(a.href)
  } catch (e) { $('stats').textContent = e.message }
})

$('container').value = cfg.container
window.addEventListener('resize', resize)
resize(); requestAnimationFrame(draw)
if (cfg.container && cfg.key) open().catch((e) => { $('err').textContent = e.message })
</script>
</body>
</html>
