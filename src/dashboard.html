<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>panya · ศูนย์ควบคุม</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #030814; --bg2: #0a1a38; --surface: #0a1730; --ink: #e8eef9; --ink2: #c3cfe6; --muted: #9db0d0;
    --line: rgba(110, 170, 255, .22); --grid: rgba(140, 180, 255, .12); --axis: rgba(140, 180, 255, .3);
    --panel: rgba(8, 20, 44, .72); --field: rgba(6, 16, 36, .78); --cyan: #7fe3ff;
    /* สีตามสิ่งที่แทน ใช้เหมือนกันทั้งหน้า: เข้า (เขียน) / เลือกไม่ตอบ / ออก (ค้นแล้วตอบได้)
       ตรวจกับพื้น #0a1730 ด้วยตัวตรวจจานสีแล้ว (แยกออกสำหรับตาบอดสี, contrast ≥ 3:1) */
    --in: #3987e5; --abstain: #d95926; --out: #199e70;
    /* สีสถานะ ใช้คู่กับไอคอนและข้อความเสมอ */
    --good: #0ca30c; --warn: #fab219; --crit: #e66767;
    --r: 12px; --tap: 44px;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: radial-gradient(1100px 700px at 50% 0%, var(--bg2), var(--bg) 70%) fixed; background-color: var(--bg);
    color: var(--ink); font-family: "Leelawadee UI", "Noto Sans Thai", Sarabun, Tahoma, system-ui, sans-serif; line-height: 1.7;
  }
  header {
    position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: rgba(5, 13, 30, .86); backdrop-filter: blur(10px);
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; white-space: nowrap; }
  h1 b { color: var(--cyan); font-weight: 600; text-shadow: 0 0 14px rgba(127, 227, 255, .7); }
  h1 span { color: var(--muted); font-weight: 400; }
  .grow { flex: 1 1 auto; }
  /* ข้อความไทยไม่ใช้ระยะห่างตัวอักษร: ทำให้สระและวรรณยุกต์เคลื่อน */
  :lang(th) h1, :lang(th) h2, :lang(th) #hud-line { letter-spacing: 0; }
  /* แถบนำทางเหมือนกันทุกหน้า: หน้าปัจจุบันเป็นพื้นทึบ อีกหน้าเป็นเส้นขอบ */
  .nav { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .nav a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 14px; color: var(--ink2); text-decoration: none; font-size: 14px; }
  .nav a:hover { background: rgba(40, 104, 190, .35); color: var(--ink); }
  .nav a[aria-current="page"] { background: rgba(57, 135, 229, .45); color: var(--ink); font-weight: 600; }
  .nav a:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  #live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  #live i { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); animation: beat 1.2s infinite; }
  #live.off i { background: var(--crit); box-shadow: 0 0 10px var(--crit); animation: none; }
  #live.paused i { background: var(--muted); box-shadow: none; animation: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.7); } 24% { transform: scale(1); } 36% { transform: scale(1.35); } 48% { transform: scale(1); } }
  input, button {
    font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; min-height: var(--tap); min-width: 0;
  }
  input::placeholder { color: #7f93b6; }
  input:focus, button:focus-visible, th:focus-visible, tr:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  button { cursor: pointer; background: rgba(28, 74, 140, .55); white-space: nowrap; transition: background .15s, box-shadow .15s; }
  button:hover { background: rgba(40, 104, 190, .7); box-shadow: 0 0 16px rgba(106, 169, 255, .35); }
  button:disabled { opacity: .6; cursor: progress; }
  button.primary { background: linear-gradient(180deg, rgb(34, 104, 190), rgb(24, 78, 152)); border-color: rgba(127, 227, 255, .5); }
  main { max-width: 1760px; margin: 0 auto; padding: 12px 16px max(28px, env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .04em; color: var(--ink2); }

  /* ตัวเลขหลัก */
  #kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 14px; }
  .kpi small { display: block; font-size: 12px; color: var(--muted); }
  .kpi strong { display: block; font-size: 26px; font-weight: 600; line-height: 1.25; }
  .kpi em { display: block; font-style: normal; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* แผงหลัก: คลื่นสัญญาณ | สมองสามมิติ | ฟีดสด */
  #deck { display: grid; grid-template-columns: 300px minmax(0, 1fr) 350px; gap: 12px; height: clamp(500px, calc(100vh - 176px), 800px); }
  #signals, #feed-panel { display: flex; flex-direction: column; min-height: 0; }
  #strips { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .strip { flex: 1 1 0; min-height: 46px; display: grid; grid-template-rows: auto 1fr; border-top: 1px solid var(--grid); padding-top: 4px; }
  .strip .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink2); line-height: 1.4; }
  .strip .lab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .lab i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .strip .lab b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .strip canvas { width: 100%; height: 100%; min-height: 26px; display: block; }
  #stage { position: relative; padding: 0; overflow: hidden; background: radial-gradient(closest-side at 50% 45%, rgba(20, 50, 110, .35), rgba(3, 9, 22, .75)); }
  #hero { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
  #hero.dragging { cursor: grabbing; } #hero.pointing { cursor: pointer; }
  .hud { position: absolute; pointer-events: none; font-size: 12px; color: var(--ink2); }
  #hud-title { top: 10px; left: 0; right: 0; text-align: center; letter-spacing: .08em; }
  #hud-title b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .22em; }
  .flow { top: 50%; transform: translateY(-50%); width: 112px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(4, 12, 28, .66); }
  .flow strong { display: block; font-size: 26px; line-height: 1.2; color: var(--ink); font-variant-numeric: tabular-nums; }
  .flow i { font-style: normal; font-weight: 600; }
  #flow-in { left: 10px; } #flow-in i { color: #7db6ff; }
  #flow-out { right: 10px; text-align: right; } #flow-out i { color: #4fd3a4; }
  #hud-foot { left: 12px; right: 12px; bottom: 8px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  #feed { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ev { border: 1px solid var(--grid); border-left: 3px solid var(--c); border-radius: 8px; padding: 6px 10px; background: rgba(4, 12, 28, .6); font-size: 13px; line-height: 1.5; animation: slide .35s ease-out; }
  .ev.in { --c: var(--in); } .ev.out { --c: var(--out); } .ev.abstain { --c: var(--abstain); } .ev.del { --c: var(--muted); }
  .ev .top { display: flex; gap: 8px; align-items: baseline; }
  .ev .dir { font-weight: 600; white-space: nowrap; }
  .ev .dir b { color: var(--c); filter: brightness(1.45); margin-right: 4px; }
  .ev strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .ev time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev p { margin: 0; color: var(--ink2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .ev small { color: var(--muted); font-size: 12px; }
  @keyframes slide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
  .state b { font-weight: 400; }
  .state.good b { color: var(--good); } .state.warn b { color: var(--warn); } .state.crit b { color: var(--crit); } .state.idle b { color: var(--muted); }

  /* กราฟ */
  #charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .plot { position: relative; height: 200px; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; font-size: 13px; padding: 4px 12px; }
  .tabs button[aria-pressed="true"] { background: rgba(57, 135, 229, .45); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); }
  .legend i, #tt i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  #tt {
    position: fixed; z-index: 11; pointer-events: none; display: none; background: rgba(6, 16, 36, .96); border: 1px solid rgba(127, 227, 255, .45);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; line-height: 1.55; box-shadow: 0 8px 28px rgba(0, 0, 0, .55); font-variant-numeric: tabular-nums; max-width: 300px;
  }
  #tt small { color: var(--muted); display: block; }

  /* ตาราง */
  .scroll { overflow-x: auto; margin: 6px -14px -12px; padding: 0 14px 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 11px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  /* ชื่อสมองติดขอบซ้ายตอนเลื่อนตารางไปด้านข้าง และขอบขวาจางเมื่อยังมีคอลัมน์ให้เลื่อน */
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .scroll.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--ink); }
  thead th[aria-sort="ascending"]::after { content: " ▲"; color: var(--cyan); }
  thead th[aria-sort="descending"]::after { content: " ▼"; color: var(--cyan); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(57, 135, 229, .12); }
  tbody td:first-child { font-weight: 600; color: var(--ink); }
  tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--axis); }
  .bar { position: relative; display: inline-block; min-width: 96px; text-align: right; }
  .bar::before { content: ""; position: absolute; left: 0; bottom: -3px; height: 3px; width: var(--w, 0%); background: var(--in); border-radius: 2px; }
  .mix { display: inline-flex; gap: 2px; width: 110px; height: 10px; vertical-align: middle; }
  .mix i { display: block; height: 100%; border-radius: 2px; min-width: 2px; }
  td svg { width: 90px; height: 20px; display: block; margin-left: auto; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; margin: 0; }

  /* แถบเสียง: ติดขอบล่างของจอ มีปุ่มเล่น คลื่นเสียงทั้งเพลง (กดเพื่อเลื่อนตำแหน่ง) แท่งความถี่สด และระดับเสียง */
  #player {
    position: sticky; bottom: 0; z-index: 7; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(5, 13, 30, .94); backdrop-filter: blur(10px);
  }
  #player[hidden] { display: none; }
  #play { width: var(--tap); padding: 0; justify-content: center; display: inline-flex; align-items: center; font-size: 15px; flex: none; }
  #player .track { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; flex: none; }
  #player .track b { font-weight: 600; font-size: 14px; white-space: nowrap; }
  #player .track small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #wave { flex: 1 1 auto; min-width: 60px; height: 44px; cursor: pointer; border-radius: 6px; }
  #bars { flex: none; width: 150px; height: 44px; }
  #snd-time { flex: none; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  #vol { flex: none; width: 96px; padding: 0; min-height: var(--tap); border: 0; background: transparent; accent-color: var(--cyan); }
  @media (max-width: 760px) { #bars { width: 64px; } #vol, #snd-time, #player .track small { display: none; } #wave { min-width: 40px; } #player { gap: 8px; padding-left: 12px; padding-right: 12px; } }

  #gate { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: radial-gradient(closest-side, rgba(3, 8, 20, .7), rgba(3, 8, 20, .94)); padding: 16px; }
  #gate form {
    display: flex; flex-direction: column; gap: 8px; width: min(380px, 100%); padding: 20px; border: 1px solid rgba(127, 227, 255, .35);
    border-radius: 16px; background: rgba(6, 16, 36, .82); backdrop-filter: blur(14px); box-shadow: 0 0 60px rgba(60, 140, 255, .22);
  }
  #gate p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  #err { color: var(--crit) !important; min-height: 1.7em; }
  @media (max-width: 1180px) {
    #deck { grid-template-columns: 1fr 1fr; height: auto; }
    #stage { grid-column: 1 / -1; order: -1; height: min(62vh, 560px); }
    #signals, #feed-panel { height: 420px; }
  }
  /* มือถือ: สมองสดขึ้นก่อนโดยไม่ต้องเลื่อน ตามด้วยตัวเลขหลักแบบสองคอลัมน์ แล้วจึงสัญญาณ ฟีด กราฟ ตาราง */
  @media (max-width: 760px) {
    #charts { grid-template-columns: 1fr; }
    #deck { display: contents; }
    #stage { order: -2; height: min(48vh, 380px); }
    #kpis { order: -1; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .kpi { padding: 6px 10px; min-width: 0; } .kpi strong { font-size: 20px; } .kpi em { font-size: 11px; }
    #signals { height: auto; } .strip { flex: none; height: 46px; }
    #feed-panel { height: 340px; }
    .plot { height: 170px; }
    .flow { width: 88px; padding: 6px 8px; } .flow strong { font-size: 20px; }
    #hud-foot span:first-child { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #live i, .ev { animation: none; } }
</style>
</head>
<body>
<header>
  <h1><b>panya</b> <span data-i18n="subtitle"></span></h1>
  <nav class="nav" data-i18n-aria="navAria"><a href="/brain" data-i18n="navBrain"></a><a href="/dashboard" aria-current="page" data-i18n="navDash"></a></nav>
  <span id="live" role="status"><i></i><span id="live-text"></span></span>
  <span class="grow"></span>
  <button id="lang" type="button"></button>
  <button id="pause" type="button" aria-pressed="false" hidden></button>
  <button id="logout" type="button" data-i18n="signOut" hidden></button>
</header>

<main id="app" hidden>
  <section id="kpis" aria-label="ตัวเลขหลัก"></section>

  <section id="deck">
    <div class="panel" id="signals" data-i18n-aria="signals">
      <div class="head"><h2 data-i18n="signals"></h2><span class="state" id="pulse-state"></span></div>
      <div id="strips"></div>
    </div>

    <div class="panel" id="stage">
      <canvas id="hero" data-i18n-aria="heroAria"></canvas>
      <div class="hud" id="hud-title"><b>PANYA MEMORY CORE</b><span id="hud-line"></span></div>
      <div class="hud flow" id="flow-in"><i data-i18n="inbound"></i><strong id="in-rate">0</strong><span data-i18n="itemsPerMin"></span></div>
      <div class="hud flow" id="flow-out"><i data-i18n="outbound"></i><strong id="out-rate">0</strong><span data-i18n="timesPerMin"></span></div>
      <div class="hud" id="hud-foot"><span data-i18n="stageHint"></span><span id="hud-orbs"></span></div>
    </div>

    <div class="panel" id="feed-panel" data-i18n-aria="feedTitle">
      <div class="head">
        <h2 data-i18n="feedTitle"></h2>
        <div class="legend"><span><i style="background: var(--in)"></i><span data-i18n="dirIn"></span></span><span><i style="background: var(--out)"></i><span data-i18n="dirOut"></span></span><span><i style="background: var(--abstain)"></i><span data-i18n="dirAbstain"></span></span></div>
      </div>
      <ul id="feed" aria-live="off"></ul>
    </div>
  </section>

  <section id="charts">
    <div class="panel">
      <div class="head">
        <h2 data-i18n="writesTitle"></h2>
        <div class="tabs" role="group" data-i18n-aria="rangeAria">
          <button type="button" data-range="minute" aria-pressed="true" data-i18n="tabMinute"></button>
          <button type="button" data-range="hour" aria-pressed="false" data-i18n="tabHour"></button>
          <button type="button" data-range="day" aria-pressed="false" data-i18n="tabDay"></button>
        </div>
      </div>
      <p class="sub" id="writes-sub"></p>
      <div class="plot"><canvas id="writes" role="img" data-i18n-aria="writesAria"></canvas></div>
    </div>
    <div class="panel" id="search-panel">
      <div class="head">
        <h2 data-i18n="searchTitle"></h2>
        <div class="legend"><span><i style="background: var(--out)"></i><span data-i18n="answered"></span></span><span><i style="background: var(--abstain)"></i><span data-i18n="abstained"></span></span></div>
      </div>
      <p class="sub" id="search-sub"></p>
      <div class="plot"><canvas id="searches" role="img" data-i18n-aria="searchAria"></canvas></div>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <h2 data-i18n="tableTitle"></h2>
      <div class="legend">
        <span><i style="background: var(--in)"></i><span data-i18n="kindFact"></span></span><span><i style="background: var(--abstain)"></i><span data-i18n="kindPref"></span></span><span><i style="background: var(--out)"></i><span data-i18n="kindEvent"></span></span>
      </div>
      <input id="filter" data-i18n-ph="filterPh" data-i18n-aria="filterPh" autocomplete="off">
    </div>
    <p class="sub" id="scroll-hint" hidden><span data-i18n="scrollHint"></span> →</p>
    <div class="scroll" id="scroll"><table id="table"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
  </section>
</main>

<section id="player" data-i18n-aria="sndTitle" hidden>
  <button id="play" type="button" class="primary" aria-pressed="false"></button>
  <div class="track"><b>Mr Scratch</b><small id="snd-state"></small></div>
  <canvas id="wave" role="slider" tabindex="0" aria-valuemin="0" aria-valuenow="0" data-i18n-aria="sndSeek"></canvas>
  <span id="snd-time">0:00 / 0:00</span>
  <canvas id="bars" aria-hidden="true"></canvas>
  <input id="vol" type="range" min="0" max="1" step="0.01" data-i18n-aria="sndVol">
</section>

<div id="tt"></div>
<div id="gate">
  <form id="login">
    <p data-i18n="gateHelp"></p>
    <input id="key" type="password" placeholder="API key" autocomplete="current-password" aria-label="API key" required>
    <button class="primary" id="enter" data-i18n="signIn"></button>
    <p id="err" role="alert"></p>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id)
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim()
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches
const TAU = Math.PI * 2, POLL = 5000, EVENT_POLL = 1000
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const sum = (a) => a.reduce((x, y) => x + y, 0)

function ago(ms, now) {
  const s = Math.max(0, (now - ms) / 1000)
  if (s < 60) return t('justNow')
  if (s < 3600) return t('minAgo', Math.floor(s / 60))
  if (s < 86400) return t('hrAgo', Math.floor(s / 3600))
  return t('dayAgo', Math.floor(s / 86400))
}
function span(ms) {
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60)
  return d ? t('spanD', d, h) : h ? t('spanH', h, m % 60) : t('spanM', m)
}

function stateOf(b, now) {
  if (now - b.lastAt < 5 * 60000) return { cls: 'good', icon: '⚡', text: t('stWriting') }
  if (b.expiringSoon) return { cls: 'warn', icon: '⚠', text: t('stExpiring', num(b.expiringSoon)) }
  if (now - b.lastAt < 86400000) return { cls: 'idle', icon: '◐', text: t('stToday') }

// ---------- แถบคลื่นสัญญาณ ----------
const ecg = { buf: new Float32Array(0), head: 0, phase: 0, acc: 0, bpm: 36, amp: 0.35 }

  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d) }
  const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, w, h)

  g.beginPath(); pts((x, y) => (x ? g.lineTo(x, y) : g.moveTo(x, y)))
  g.strokeStyle = `rgba(${rgb}, .25)`; g.lineWidth = 5; g.stroke()
  g.strokeStyle = `rgba(${rgb}, .95)`; g.lineWidth = 1.6; g.stroke()
  // หางจางลงทางซ้าย
  g.globalCompositeOperation = 'destination-out'
  const fade = g.createLinearGradient(0, 0, w * 0.4, 0); fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)')

}
// ชีพจรรวม: เส้นคลื่นแบบเครื่องวัดชีพจร เต้นเร็วและสูงขึ้นตามอัตราการเขียนจริง
function drawEcg(cv, dt) {
  const { g, w, h } = fit(cv)
  if (!w) return
  const SPEED = 90
  if (ecg.buf.length !== w) { ecg.buf = new Float32Array(w); ecg.head = 0 }
  let steps = calm ? (ecg.head ? 0 : w) : Math.floor((ecg.acc += dt * SPEED))
  if (!calm) ecg.acc -= steps
  while (steps-- > 0) { ecg.phase += ecg.bpm / 60 / SPEED; ecg.buf[ecg.head % w] = wave(ecg.phase % 1) * ecg.amp + (zr() - 0.5) * 0.02; ecg.head++ }
  trace(g, w, h, '150, 232, 255', (put) => { for (let x = 0; x < w; x++) put(x, h * 0.7 - ecg.buf[(ecg.head + x) % w] * h * 0.6) })
}
// แถบข้อมูลจริง: จำนวนต่อวินาทีของ 90 วินาทีล่าสุด เลื่อนไปตามเวลา
const smooth = new Map()
function drawStrip(ch, now, t) {
  const { g, w, h } = fit(ch.cv)
  if (!w) return
  const m = signal.get(ch.id), sec = now / 1000, s0 = Math.floor(sec), frac = sec - s0
  let peak = 1
  if (m) for (let k = 0; k <= WINDOW; k++) peak = Math.max(peak, m.get(s0 - k) ?? 0)
  const scale = smooth.get(ch.id) ?? peak, sc = scale + (peak - scale) * 0.08
  smooth.set(ch.id, sc)
  const val = (s) => (m ? m.get(s) ?? 0 : 0)
  trace(g, w, h, ch.rgb, (put) => {
    for (let x = 0; x <= w; x += 2) {
      const age = ((w - x) / w) * WINDOW, at = sec - age, a = Math.floor(at), k = at - a, e = k * k * (3 - 2 * k)
      const v = val(a) + (val(a + 1) - val(a)) * e
      // คลื่นพาหะเล็ก ๆ ให้เห็นการเคลื่อนไหว ขนาดตามค่าจริง (ค่าเป็นศูนย์ = เส้นเกือบเรียบ)
      const ripple = calm ? 0 : Math.sin(at * 9 + ch.seed) * Math.sin(at * 2.3 + ch.seed) * (0.03 + 0.12 * Math.min(1, v / sc))
      put(x, h - 3 - (Math.min(1, v / sc) * 0.82 + ripple + 0.04) * (h - 8))

}

// เบราว์เซอร์ไม่ยอมให้เล่นเสียงเอง จึงเริ่มเมื่อผู้ใช้กดเล่นเท่านั้น และไฟล์เพลงถูกโหลดตอนนั้น
const audio = new Audio()
audio.src = '/assets/mr-scratch.mp3'; audio.loop = true; audio.preload = 'none'
audio.volume = Math.max(0, Math.min(1, Number(localStorage.getItem('panya.vol') ?? 0.6)))
const snd = { ctx: null, analyser: null, freq: null, time: null, peaks: null, state: 'sndIdle' }
const PEAKS = 480
const mmss = (s) => (Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00')
function setSnd(state) {
  snd.state = state
  const on = !audio.paused
  $('snd-state').textContent = t(state)
  $('play').textContent = on ? '❚❚' : '▶'; $('play').setAttribute('aria-pressed', String(on)); $('play').setAttribute('aria-label', t(on ? 'sndPause' : 'sndPlay'))
}
// คลื่นเสียงทั้งเพลง: ถอดรหัสไฟล์ครั้งเดียว แล้วเก็บค่าสูงสุดของแต่ละช่วงไว้วาด
async function loadPeaks() {
  const pcm = (await snd.ctx.decodeAudioData(await (await fetch(audio.src)).arrayBuffer())).getChannelData(0)
  const size = Math.floor(pcm.length / PEAKS), peaks = new Float32Array(PEAKS)
  let top = 0
  for (let b = 0; b < PEAKS; b++) { let m = 0; for (let i = b * size, e = i + size; i < e; i += 32) m = Math.max(m, Math.abs(pcm[i])); peaks[b] = m; top = Math.max(top, m) }
  for (let b = 0; b < PEAKS; b++) peaks[b] /= top || 1
  snd.peaks = peaks
  if (!audio.paused) setSnd('sndPlaying')
}
async function togglePlay() {
  try {
    if (!snd.ctx) {
      snd.ctx = new AudioContext()
      snd.analyser = snd.ctx.createAnalyser(); snd.analyser.fftSize = 256; snd.analyser.smoothingTimeConstant = 0.8
      snd.ctx.createMediaElementSource(audio).connect(snd.analyser); snd.analyser.connect(snd.ctx.destination)
      snd.freq = new Uint8Array(snd.analyser.frequencyBinCount); snd.time = new Uint8Array(snd.analyser.fftSize)
      loadPeaks().catch(() => {})
    }
    if (snd.ctx.state === 'suspended') await snd.ctx.resume()

}
audio.addEventListener('play', () => setSnd(snd.peaks ? 'sndPlaying' : 'sndLoading'))

const seekTo = (s) => { if (Number.isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(audio.duration - 0.1, s)) }
$('wave').addEventListener('pointerdown', (ev) => {

})

let shownTime = ''
function drawPlayer() {
  const playing = !audio.paused && snd.analyser, dur = audio.duration, at = Number.isFinite(dur) ? audio.currentTime / dur : 0
  // คลื่นเสียงทั้งเพลง: ส่วนที่เล่นไปแล้วสว่าง ส่วนที่เหลือจาง ทับด้วยเส้นคลื่นสดขณะเล่น
  const a = fit($('wave'))
  if (a.w) {
    const g = a.g, n = Math.floor(a.w / 3), mid = a.h / 2
    for (const played of [true, false]) {
      g.fillStyle = played ? 'rgba(127, 227, 255, .95)' : 'rgba(110, 150, 210, .38)'
      g.beginPath()
      for (let i = 0; i < n; i++) {
        if ((i / n < at) !== played) continue
        const p = snd.peaks ? snd.peaks[Math.floor((i / n) * PEAKS)] : 0.05, hgt = Math.max(2, p * (a.h - 6))
        g.roundRect(i * 3, mid - hgt / 2, 2, hgt, 1)

      g.fill()

      snd.analyser.getByteTimeDomainData(snd.time)
      g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(232, 250, 255, .75)'; g.lineWidth = 1.4; g.lineJoin = 'round'
      g.beginPath()
      for (let i = 0; i < snd.time.length; i++) { const x = (i / (snd.time.length - 1)) * a.w, y = mid + ((snd.time[i] - 128) / 128) * a.h * 0.48; i ? g.lineTo(x, y) : g.moveTo(x, y) }
      g.stroke(); g.globalCompositeOperation = 'source-over'
    }
    g.fillStyle = 'rgba(255, 236, 200, .95)'; g.fillRect(Math.round(at * a.w), 2, 1.5, a.h - 4)
  }
  // แท่งความถี่สด: เสียงต่ำอยู่ซ้าย เสียงสูงอยู่ขวา
  const b = fit($('bars'))

  if (label !== shownTime) { $('snd-time').textContent = shownTime = label; $('wave').setAttribute('aria-valuenow', String(Math.round(audio.currentTime))); if (Number.isFinite(dur)) $('wave').setAttribute('aria-valuemax', String(Math.round(dur))) }
}

const tween = new Map()
function setNum(el, to, fmt = num) {
  const from = tween.get(el) ?? to

  const t0 = performance.now()
  const step = (now) => { const k = Math.min(1, (now - t0) / 500), e = 1 - (1 - k) ** 3; if (tween.get(el) !== to) return; el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}

  { key: 'live', label: 'cLive', get: (b) => b.live },
  { key: 'share', label: 'cShare', get: (b) => b.live },
  { key: 'm60', label: 'cM60', get: (b) => sum(b.minute) },
  { key: 'h24', label: 'cH24', get: (b) => sum(b.hour) },
  { key: 'trend', label: 'cTrend', get: (b) => sum(b.hour) },
  { key: 'd30', label: 'cD30', get: (b) => sum(b.day) },
  { key: 'mix', label: 'cMix', get: (b) => b.kinds.fact, l: true },
  { key: 'keyed', label: 'cKeyed', get: (b) => b.keyed },
  { key: 'sources', label: 'cSources', get: (b) => b.sources },
  { key: 'superseded', label: 'cSuperseded', get: (b) => b.superseded },
  { key: 'expired', label: 'cExpired', get: (b) => b.expired },
  { key: 'merges', label: 'cMerges', get: (b) => b.merges },
  { key: 'avg', label: 'cAvg', get: (b) => (b.live ? b.chars / b.live : 0) },
  { key: 'firstAt', label: 'cFirst', get: (b) => b.firstAt },
  { key: 'lastAt', label: 'cLast', get: (b) => b.lastAt },
  { key: 'state', label: 'cState', get: (b) => b.lastAt, l: true },
]
function renderTable(d) {
  const now = d.now, col = COLS.find((c) => c.key === sort.key) || COLS[1]
  const rows = d.brains.filter((b) => b.brain.toLowerCase().includes(filter)).sort((a, b) => {
    const x = col.get(a), y = col.get(b)
    return (col.text ? String(x).localeCompare(String(y)) : x - y) * sort.dir
  })
  $('table').tHead.innerHTML = '<tr>' + COLS.map((c) => `<th scope="col" tabindex="0" data-key="${c.key}"${c.l ? ' class="l"' : ''}${c.key === sort.key ? ` aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${t(c.label)}</th>`).join('') + '</tr>'
  const maxLive = Math.max(...d.brains.map((b) => b.live), 1), allLive = sum(d.brains.map((b) => b.live)) || 1
  const mix = (k) => {
    const all = k.fact + k.preference + k.event || 1, tip = t('mixTip', num(k.fact), num(k.preference), num(k.event))
    return `<span class="mix" role="img" aria-label="${tip}" title="${tip}">` + [['fact', '--in'], ['preference', '--abstain'], ['event', '--out']].filter(([n]) => k[n]).map(([n, v]) => `<i style="flex:${k[n] / all};background:var(${v})"></i>`).join('') + '</span>'
  }
  const day = (ms) => new Date(ms).toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: '2-digit' })
  const cells = (b) => [
    esc(b.brain), `<span class="bar" style="--w:${(b.live / maxLive) * 100}%">${num(b.live)}</span>`, ((b.live / allLive) * 100).toFixed(1) + '%',
    num(sum(b.minute)), num(sum(b.hour)), spark(b.hour), num(sum(b.day)), mix(b.kinds), num(b.keyed), num(b.sources), num(b.superseded), num(b.expired), num(b.merges),
    b.live ? num(b.chars / b.live) + ' ' + t('chars') : '-', day(b.firstAt), ago(b.lastAt, now), stateHtml(stateOf(b, now)),
  ]
  $('table').tBodies[0].innerHTML = rows.length
    ? rows.map((b) => `<tr data-brain="${esc(b.brain)}" tabindex="0">` + cells(b).map((v, i) => `<td${COLS[i].l ? ' class="l"' : ''}>${v}</td>`).join('') + '</tr>').join('')
    : `<tr><td class="l" colspan="${COLS.length}"><span class="empty">${d.brains.length ? t('noMatch') : t('noBrains')}</span></td></tr>`
  const tot = (f) => num(sum(rows.map(f)))
  const kinds = rows.reduce((a, b) => ({ fact: a.fact + b.kinds.fact, preference: a.preference + b.kinds.preference, event: a.event + b.kinds.event }), { fact: 0, preference: 0, event: 0 })
  const live = sum(rows.map((b) => b.live))
  $('table').tFoot.innerHTML = rows.length > 1 ? '<tr>' + [
    t('total', num(rows.length)), num(live), ((live / allLive) * 100).toFixed(1) + '%', tot((b) => sum(b.minute)), tot((b) => sum(b.hour)), '', tot((b) => sum(b.day)), mix(kinds),
    tot((b) => b.keyed), tot((b) => b.sources), tot((b) => b.superseded), tot((b) => b.expired), tot((b) => b.merges), live ? num(sum(rows.map((b) => b.chars)) / live) + ' ' + t('chars') : '-', '', '', '',
  ].map((v, i) => `<td${COLS[i].l ? ' class="l"' : ''}>${v}</td>`).join('') + '</tr>' : ''
}

// ตารางกว้างกว่าจอ: บอกเป็นคำและทำขอบขวาจาง เฉพาะตอนที่ยังมีคอลัมน์ให้เลื่อนจริง
function markScroll() {
  const s = $('scroll'), extra = s.scrollWidth - s.clientWidth
  s.classList.toggle('more', extra - s.scrollLeft > 4)
  $('scroll-hint').hidden = extra <= 4
}
$('scroll').addEventListener('scroll', markScroll, { passive: true })

function render() {
  if (!data) return
  renderKpis(data); renderStage(data); renderRates(); renderCharts(data); renderTable(data); markScroll()
}

// ---------- ฟีดสด ----------
function feedItem(e) {
  const abst = e.type === 'out' && e.abstained
  const cls = e.type === 'in' ? 'in' : e.type === 'del' ? 'del' : abst ? 'abstain' : 'out'
  const dir = e.type === 'in' ? ['↓', t('dirIn')] : e.type === 'del' ? ['✕', t('dirDel')] : abst ? ['∅', t('dirAbstain')] : ['↑', t('dirOut')]
  let text = e.text, meta
  if (e.type === 'in') meta = t('items', num(e.n)) + [['created', 'evNew'], ['superseded', 'evReplaced'], ['merged', 'evMerged']].filter(([k]) => e[k]).map(([k, l]) => ` · ${t(l)} ${num(e[k])}`).join('')
  else if (e.type === 'out') { text = t('asked') + e.text; meta = (abst ? t(e.reason === 'unknown_entity' ? 'whyUnknown' : 'whyNoMatch') : t('found', num(e.hits))) + ` · ${num(e.ms)} ms` }
  else { text = e.what === 'brain' ? t('delBrain') : e.what === 'source' ? t('delSource', e.text) : t('delOne'); meta = '' }
  const li = document.createElement('li')
  li.className = 'ev ' + cls
  li.innerHTML = `<div class="top"><span class="dir"><b aria-hidden="true">${dir[0]}</b>${dir[1]}</span><strong>${esc(e.brain)}</strong><time>${clock(e.at, true)}</time></div><p>${esc(text)}</p>${meta ? `<small>${esc(meta)}</small>` : ''}`
  return li
}
let recent = [] // เหตุการณ์ที่แสดงอยู่ในฟีด เก็บไว้เพื่อวาดใหม่เมื่อสลับภาษา
function takeEvents(list, animate) {
  const feed = $('feed')
  if (list.length) feed.querySelector('.empty')?.remove()
  for (const e of list) {
    addSignal(e.type === 'in' ? 'in' : e.type === 'out' ? (e.abstained ? 'abstain' : 'out') : 'del', e.at, e.type === 'in' ? e.n : 1)
    if (e.type === 'in') addSignal('b:' + e.brain, e.at, e.n)
    feed.prepend(feedItem(e))
    if (animate) animateEvent(e, T)
  }
  recent = recent.concat(list).slice(-80)
  while (feed.children.length > 80) feed.lastChild.remove()
  if (!feed.children.length) feed.innerHTML = `<li class="empty">${esc(t('feedEmpty'))}</li>`
}
function redrawFeed() {
  $('feed').innerHTML = recent.length ? '' : `<li class="empty">${esc(t('feedEmpty'))}</li>`
  for (const e of recent) $('feed').prepend(feedItem(e))
}
async function pollEvents() {
  clearTimeout(evTimer)
  if (paused || !key) return
  try {
    const res = await fetch('/v1/events' + (lastSeq === null ? '' : '?after=' + lastSeq), { headers: { authorization: 'Bearer ' + key } })
    if (res.ok) {
      const j = await res.json()
      clockSkew = j.now - Date.now()
      // ลำดับถอยหลัง = เซิร์ฟเวอร์รีสตาร์ต เริ่มนับใหม่
      if (lastSeq !== null && j.seq < lastSeq) { lastSeq = null; evTimer = setTimeout(pollEvents, 200); return }
      takeEvents(j.events, lastSeq !== null)
      lastSeq = j.seq
      renderRates()
    }
  } catch {}
  evTimer = setTimeout(pollEvents, EVENT_POLL)
}

// ---------- ข้อมูล ----------
async function load() {
  const res = await fetch('/v1/overview', { headers: { authorization: 'Bearer ' + key } })
  if (res.status === 401) throw Object.assign(new Error(t('badKey')), { auth: true })
  if (!res.ok) throw new Error(t('serverSays', res.status))
  data = await res.json()
}
// สถานะบนหัวหน้า เก็บเป็นคีย์ข้อความเพื่อให้เปลี่ยนตามภาษาได้
let liveState = ['paused', 'waitLogin']
function setLive(cls, k, ...a) { liveState = [cls, k, ...a]; $('live').className = cls; $('live-text').textContent = t(k, ...a) }
const stamp = () => setLive('', 'liveAt', new Date().toLocaleTimeString(loc(), { hour12: false }))
async function tick() {
  clearTimeout(timer)
  if (paused) return
  try { await load(); render(); stamp() } catch (e) {
    if (e.auth) return signOut(e.message)
    setLive('off', 'offline', e.message)
  }
  timer = setTimeout(tick, POLL)
}
function signOut(message) {
  clearTimeout(timer); clearTimeout(evTimer); sessionStorage.removeItem('panya.key'); key = ''; data = null; lastSeq = null; recent = []
  $('app').hidden = true; $('gate').style.display = ''; $('pause').hidden = true; $('logout').hidden = true; $('feed').innerHTML = ''
  audio.pause(); $('player').hidden = true
  $('err').textContent = message || ''; setLive('paused', 'waitLogin')
}
async function signIn() {
  await load()
  sessionStorage.setItem('panya.key', key)
  $('gate').style.display = 'none'; $('app').hidden = false; $('pause').hidden = false; $('logout').hidden = false; $('player').hidden = false
  render(); stamp()
  timer = setTimeout(tick, POLL); pollEvents()
}

$('login').addEventListener('submit', async (ev) => {
  ev.preventDefault()
  key = $('key').value.trim(); $('err').textContent = ''
  const btn = $('enter'); btn.disabled = true; btn.textContent = t('signingIn')
  try { await signIn() } catch (e) { $('err').textContent = e.message } finally { btn.disabled = false; btn.textContent = t('signIn') }
})
$('logout').addEventListener('click', () => signOut())
$('pause').addEventListener('click', () => {
  paused = !paused
  $('pause').textContent = t(paused ? 'resume' : 'pause'); $('pause').setAttribute('aria-pressed', String(paused))
  if (paused) { clearTimeout(timer); clearTimeout(evTimer); setLive('paused', 'paused') } else { tick(); pollEvents() }
})
// สลับภาษา: ข้อความคงที่ ป้ายสถานะ การ์ดตัวเลข แถบสัญญาณ และฟีด ถูกวาดใหม่ทั้งหมด
function setLang(next) {
  lang = next; localStorage.setItem('panya.lang', lang)
  applyLang()
  $('pause').textContent = t(paused ? 'resume' : 'pause'); $('hud-line').textContent = t('connecting'); $('err').textContent = ''
  setLive(...liveState); setSnd(snd.state)
  $('kpis').innerHTML = ''; channels = []; $('strips').innerHTML = ''
  redrawFeed(); render()
}
$('lang').addEventListener('click', () => setLang(lang === 'th' ? 'en' : 'th'))
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => {
  range = b.dataset.range
  for (const x of document.querySelectorAll('.tabs button')) x.setAttribute('aria-pressed', String(x === b))
  if (data) renderCharts(data)
})
$('filter').addEventListener('input', () => { filter = $('filter').value.trim().toLowerCase(); if (data) renderTable(data) })
const sortBy = (k) => { sort = { key: k, dir: sort.key === k ? -sort.dir : k === 'brain' ? 1 : -1 }; if (data) renderTable(data) }
$('table').tHead.addEventListener('click', (ev) => { const th = ev.target.closest('th'); if (th) sortBy(th.dataset.key) })
$('table').tHead.addEventListener('keydown', (ev) => { const th = ev.target.closest('th'); if (th && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); sortBy(th.dataset.key) } })
$('table').tBodies[0].addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-brain]'); if (tr) openBrain(tr.dataset.brain) })
$('table').tBodies[0].addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-brain]'); if (tr && ev.key === 'Enter') openBrain(tr.dataset.brain) })
addEventListener('resize', () => { paint($('writes')); paint($('searches')); markScroll() })
document.addEventListener('visibilitychange', () => { if (!document.hidden && key && !paused && !$('app').hidden) { tick(); pollEvents() } })

setLang(lang)
requestAnimationFrame(frame)
if (key) signIn().catch((e) => signOut(e.auth ? '' : e.message))
</script>
